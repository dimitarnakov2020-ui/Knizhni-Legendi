<!DOCTYPE html>
<html lang="bg" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжни Легенди — Жива Библиотека</title>

    <!-- Tailwind CSS за адаптивен дизайн -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Шрифтове Playfair Display и Inter с поддръжка на кирилица -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        bgMain: '#0A0D14',
                        cardBg: '#121826',
                        cardHover: '#192234',
                        amberAccent: '#F59E0B',
                        amberBright: '#FBBF24',
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0A0D14;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Начален екран — тъмна тема (#0A0D14) с дискретно осветление */
        .library-bg {
            background-color: #0A0D14;
            background-image:
                radial-gradient(circle at 14% 10%, rgba(245, 158, 11, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 86% 88%, rgba(30, 58, 138, 0.09) 0%, transparent 48%);
        }

        /* Екран за разговор — тъмен библиотечен фон */
        .chat-bg {
            background-color: #090B10;
            background-image:
                linear-gradient(180deg, rgba(9, 11, 16, 0.9) 0%, rgba(11, 14, 21, 0.85) 55%, rgba(8, 10, 15, 0.96) 100%),
                repeating-linear-gradient(
                    90deg,
                    rgba(148, 163, 184, 0.025) 0px,
                    rgba(148, 163, 184, 0.025) 2px,
                    transparent 2px,
                    transparent 42px
                ),
                radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.05) 0%, transparent 60%);
        }

        /* Скрит скролбар за хоризонталния списък и бързите бутони */
        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Фин скролбар за зоната със съобщения */
        .chat-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.22);
            border-radius: 9999px;
        }

        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.65); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .dot-1 { animation: pulseDot 1.3s infinite ease-in-out -0.32s; }
        .dot-2 { animation: pulseDot 1.3s infinite ease-in-out -0.16s; }
        .dot-3 { animation: pulseDot 1.3s infinite ease-in-out 0s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-view {
            animation: fadeInUp 0.22s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased selection:bg-amberAccent/30 selection:text-amber-200">

    <!-- ===================================================================== -->
    <!-- 1. НАЧАЛЕН ЕКРАН — ЖИВА БИБЛИОТЕКА                                    -->
    <!-- ===================================================================== -->
    <div id="home-screen" class="library-bg min-h-screen w-full flex flex-col justify-between px-4 sm:px-7 py-6 sm:py-9">
        <div class="w-full max-w-5xl mx-auto flex-1 flex flex-col justify-between">
            <div>
                <!-- Златист етикет с иконка на отворена книга -->
                <header class="mb-4 sm:mb-5 animate-view">
                    <div class="inline-flex items-center gap-2 text-[#EAB308] tracking-[0.22em] text-[11px] sm:text-xs font-semibold uppercase">
                        <svg class="w-4 h-4 text-[#EAB308] shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                        </svg>
                        <span>ЖИВА БИБЛИОТЕКА</span>
                    </div>
                </header>

                <!-- Голямо серифно заглавие и подзаглавие -->
                <section class="mb-7 sm:mb-9 animate-view">
                    <h1 class="font-serif text-[42px] sm:text-6xl font-extrabold text-white tracking-tight leading-[1.05] mb-3.5">
                        Книжни<br>Легенди
                    </h1>
                    <p class="text-[#94A3B8] text-[15px] sm:text-lg leading-relaxed max-w-md font-normal">
                        Избери герой и поговори с него така, сякаш е седнал срещу теб.
                    </p>
                </section>

                <!-- Хоризонтален скрол списък с 5-те героя в точния ред -->
                <section aria-label="Герои от живата библиотека" class="animate-view">
                    <div id="heroes-carousel" class="no-scrollbar flex gap-4 sm:gap-5 overflow-x-auto pb-3 snap-x snap-mandatory scroll-smooth">
                        <!-- Картите се рендират от JS -->
                    </div>
                    <p class="text-center text-xs text-[#64748B] mt-3 tracking-wide">
                        Плъзни, за да видиш всички герои
                    </p>
                </section>
            </div>

            <!-- Долна лента без четене/запис на стари разговори или лична история -->
            <footer class="mt-6 pt-2 animate-view">
                <div class="bg-[#111622] border border-slate-800/90 rounded-2xl px-4 py-3.5 sm:px-5 sm:py-4 flex items-center justify-between gap-3 shadow-lg">
                    <div class="min-w-0 flex-1">
                        <p class="text-white font-semibold text-sm sm:text-base">
                            Всеки разговор започва на чисто
                        </p>
                        <p class="text-xs text-[#64748B] mt-0.5">
                            Без запазена стара история или лични данни
                        </p>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- 2. ЕКРАН ЗА РАЗГОВОР С ГЕРОЯ                                         -->
    <!-- ===================================================================== -->
    <div id="chat-screen" class="chat-bg hidden min-h-screen w-full flex flex-col justify-between animate-view">

        <!-- Горна лента: стрелка назад, квадратен портрет, име и известен цитат под името -->
        <header class="sticky top-0 z-20 bg-[#0D1017]/95 backdrop-blur-md border-b border-slate-800/80 px-3.5 sm:px-6 py-3">
            <div class="max-w-3xl mx-auto flex items-center gap-3">
                <button
                    type="button"
                    id="btn-back-to-library"
                    aria-label="Назад към библиотеката"
                    class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-[#161B26] hover:bg-[#1F2737] text-slate-200 hover:text-amberBright border border-slate-700/70 flex items-center justify-center transition-all shrink-0 active:scale-95"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </button>

                <!-- Малък квадратен портрет на героя -->
                <div id="header-hero-avatar" class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl overflow-hidden border border-slate-700/80 bg-[#141A26] shrink-0 shadow-md"></div>

                <!-- Името на героя и директно под него известен цитат -->
                <div class="min-w-0 flex-1">
                    <h2 id="header-hero-name" class="font-sans text-lg sm:text-xl font-bold text-white leading-tight truncate"></h2>
                    <p id="header-hero-quote" class="font-serif italic text-xs sm:text-[13px] text-[#94A3B8] leading-snug line-clamp-2 mt-0.5"></p>
                </div>
            </div>
        </header>

        <!-- Зона със съобщения от текущия разговор -->
        <main id="messages-area" class="chat-scroll flex-1 w-full max-w-3xl mx-auto px-3.5 sm:px-6 py-5 overflow-y-auto flex flex-col gap-4">
            <!-- Съобщенията се рендират динамично -->
        </main>

        <!-- Долна зона: бързи бутони, поле за писане, бутон за изпращане и пояснение -->
        <div class="sticky bottom-0 z-20 bg-gradient-to-t from-[#080A0F] via-[#0A0D14]/95 to-transparent pt-2 pb-3.5 sm:pb-5 px-3.5 sm:px-6">
            <div class="max-w-3xl mx-auto">

                <!-- Бързи бутони над полето за писане -->
                <div id="quick-pills" class="no-scrollbar flex items-center gap-2 overflow-x-auto pb-2.5">
                    <!-- Бутоните се генерират от JS -->
                </div>

                <!-- Поле за въвеждане и бутон за изпращане -->
                <form id="chat-form" class="bg-[#121620] border border-slate-700/80 focus-within:border-amberAccent/80 rounded-2xl p-1.5 sm:p-2 flex items-end gap-2 shadow-2xl transition-colors">
                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="Напиши на героя..."
                        class="flex-1 bg-transparent text-white placeholder-slate-400 px-3 py-2 text-sm sm:text-[15px] focus:outline-none resize-none max-h-32 leading-relaxed"
                    ></textarea>
                    <button
                        type="submit"
                        id="send-btn"
                        aria-label="Изпрати съобщение"
                        class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-amberAccent hover:bg-amberBright text-[#0A0D14] flex items-center justify-center transition-all shadow-lg shadow-amberAccent/20 disabled:opacity-40 disabled:cursor-not-allowed shrink-0 active:scale-95"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </form>

                <!-- Текст под полето за въвеждане -->
                <p class="text-center text-[11px] sm:text-xs text-[#64748B] mt-2.5 tracking-wide">
                    Героите отговарят в образ. Enter изпраща, Shift+Enter е нов ред.
                </p>
            </div>
        </div>
    </div>

    <!-- ===================================================================== -->

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        // Резервен генератор в образа на героя само за текущото съобщение
        function buildFallbackReply(hero, userText) {
            const q = (userText || '').toLowerCase();

            if (hero.id === 'drandyo') {
                if (q.includes('дневник') || q.includes('спомен')) {
                    return 'Пак да го кажа: това НЕ е дневник, а книга за спомени! Като стана богат и известен един ден, няма да имам време да обяснявам — просто ще им оставя книгата да си я четат.';
                }
                if (q.includes('родрик')) {
                    return 'Родрик пак прави номера с групата си и ми пречи, а накрая на мен ми спират видеоигрите. Пълна несправедливост е в тая къща.';
                }
                if (q.includes('план')) {
                    return 'Планът е прост: да стана известен, без да включва тичане, тежка работа или домакински задачи. Още го доизпипвам.';
                }
            }

            if (hero.id === 'little-prince') {
                if (q.includes('опитом')) {
                    return 'Да опитомиш някого значи да създадеш връзка — тогава двамата ставате единствени на света. Но после оставаш отговорен завинаги за това, което си опитомил.';
                }
                if (q.includes('роз')) {
                    return 'Моята Роза на Астероид Б-612 понякога е капризна и горда, но за мен е единствена, защото съм я пазил и съм я слушал.';
                }
                if (q.includes('възрастн')) {
                    return 'Възрастните често гледат само цифрите и забравят онова, което се вижда истински само със сърцето.';
                }
            }

            if (hero.id === 'percy-jackson') {
                if (q.includes('въртоп') || q.includes('меч')) {
                    return 'Въртоп изглежда като обикновена химикалка в джоба ми, но махнеш ли капачката, става на меч от небесен бронз. Само не става за писане на домашни заради дислексията ми.';
                }
                if (q.includes('синя') || q.includes('хран')) {
                    return 'Синята храна е най-добрата част от деня след битка с някое чудовище — сини палачинки, сини бисквити, всичко синьо. Традиция от майка ми.';
                }
                if (q.includes('олимп') || q.includes('бог')) {
                    return 'Боговете на Олимп все си мерят силите и мълниите, а ние в Лагера на нечистокръвните трябва да оправяме кашите им. Добре че Анабет пази хладнокръвие.';
                }
            }

            if (hero.id === 'bai-ganyo') {
                if (q.includes('мускал') || q.includes('масло') || q.includes('келепир')) {
                    return 'Охоо, мускалите ми са си на място в дисагите, бре! Чисто розово масло — само да го подушат тия из Европата, и веднага почват да пресмятат. Ама аз келепира не го изпускам лесно!';
                }
                if (q.includes('европ')) {
                    return 'Абе каква Европа, бре! Всичко съм видял — и надути салтанати, и стиснати сметки. Като кажа „Булгар, булгар!“, веднага се разбира кой откъде идва!';
                }
            }

            if (hero.id === 'harry-potter') {
                if (q.includes('метл') || q.includes('куидич') || q.includes('лет')) {
                    return 'Когато се отлепиш от земята на метлата, целият шум от подземията изчезва. Само вятърът, игрището и Златният снич — стига да не те гони някой блъджър.';
                }
                if (q.includes('снейп') || q.includes('отвар') || q.includes('мушка')) {
                    return 'Снейп ме взима на мушка още от първия ми час по отвари. Дори да следвам всяка инструкция точно, пак някак намира повод да се заяде.';
                }
                if (q.includes('рон') || q.includes('хърмаяни')) {
                    return 'Рон и Хърмаяни са най-добрите ми приятели. Хърмаяни познава всяко заклинание и всяка книга, а Рон винаги ме кара да се усмихна дори когато сме в най-голямата беля.';
                }
            }

            const lastMsg = sessionState.currentMessages[sessionState.currentMessages.length - 1]?.text || '';
            const candidates = hero.fallbackReplies.filter((r) => r !== lastMsg);
            const pool = candidates.length > 0 ? candidates : hero.fallbackReplies;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // Извикване на Gemini API с exponential backoff и резервен генератор
        async function fetchHeroResponse(hero, messagesInCurrentChat) {
            const apiKey = "";
            const model = "gemini-3-flash-preview";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

            const instruction = `${hero.systemPrompt}

Правила за отговор:
- Говори ВИНАГИ на естествен, жив български език в автентичния стил на героя.
- Опирай се само на текущия разговор пред себе си; не споменавай стари разговори или лична история.
- Отговорът да бъде естествен, жив и с дължина 2 до 5 изречения.`;

            const formattedContents = messagesInCurrentChat.slice(-12).map((m) => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            }));

            const payload = {
                contents: formattedContents,
                systemInstruction: {
                    parts: [{ text: instruction }]
                },
                generationConfig: {
                    temperature: 0.9,
                    maxOutputTokens: 500
                }
            };

            const delays = [1000, 2000, 4000];
            const lastUserMessage = messagesInCurrentChat[messagesInCurrentChat.length - 1]?.text || '';

            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 11000);

                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });

                    clearTimeout(timer);

                    if (!res.ok) {
                        throw new Error(`Status ${res.status}`);
                    }

                    const data = await res.json();
                    const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (replyText && replyText.trim()) {
                        return replyText.trim();
                    }

                    throw new Error('Empty response');
                } catch (err) {
                    if (attempt < delays.length) {
                        await new Promise((r) => setTimeout(r, delays[attempt]));
                    } else {
                        return buildFallbackReply(hero, lastUserMessage);
                    }
                }
            }
        }

        // Изпращане на съобщение в текущия чат
        async function submitText(rawText) {
            if (sessionState.isSending || !sessionState.activeHero) return;
            const text = (rawText || '').trim();
            if (!text) return;

            const hero = sessionState.activeHero;

            sessionState.currentMessages.push({ role: 'user', text });
            messageInput.value = '';
            messageInput.style.height = 'auto';
            renderMessages();

            sessionState.isSending = true;
            sendBtn.disabled = true;
            showTypingIndicator(hero);

            try {
                const aiReply = await fetchHeroResponse(hero, sessionState.currentMessages);
                removeTypingIndicator();
                sessionState.currentMessages.push({ role: 'model', text: aiReply });
                renderMessages();
            } finally {
                sessionState.isSending = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLibrary();

            btnBackToLibrary.addEventListener('click', returnToLibrary);

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                submitText(messageInput.value);
            });

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitText(messageInput.value);
                }
            });

            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 128) + 'px';
            });
        });
    </script>
